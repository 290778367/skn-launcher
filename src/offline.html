<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>SKN 键盘驱动 · 离线</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #1d2129;
        background: #f7f8fa;
      }
      .card {
        max-width: 520px;
        background: #fff;
        border: 1px solid #e5e6eb;
        border-radius: 12px;
        padding: 28px 30px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 8px; color: #4e5969; }
      ul { text-align: left; margin: 14px 0 20px; padding-left: 20px; color: #4e5969; }
      li { margin-bottom: 4px; }
      button {
        padding: 9px 22px;
        border: 0;
        border-radius: 6px;
        background: #165dff;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #0e42d2; }
      .fine { margin-top: 14px; color: #86909c; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>离线缓存里还没有页面</h1>
      <p>这是第一次在这台电脑上打开，而且现在连不上驱动官网，所以界面暂时没有内容。</p>
      <ul>
        <li>先连一次网络并打开本程序，界面会自动缓存到本地；</li>
        <li>之后即使断网，改键、宏、灯光等设置也能正常使用。</li>
      </ul>
      <button onclick="location.reload()">重新加载</button>
      <p class="fine">连接键盘本身不需要网络；只有第一次获取界面需要联网。</p>
    </div>
  </body>
</html>
